<h2>Student List (CRUD - Read)</h2>
<a href="{% url 'student_add_url' %}">Add New Student +</a>
<table border="1" cellpadding="5">
    <tr>
        <th>Name</th><th>Enrollment</th><th>Department</th><th>Semester</th><th>Actions</th>
    </tr>
    {% for s in students %}
    <tr>
        <td>{{ s.name }}</td>
        <td>{{ s.enrollment }}</td>
        <td>{{ s.department }}</td>
        <td>{{ s.semester }}</td>
        <td>
            <a href="{% url 'student_update_url' s.id %}">Edit</a> | 
            <a href="{% url 'student_delete_url' s.id %}">Delete</a>
        </td>
    </tr>
    {% endfor %}
</table>
